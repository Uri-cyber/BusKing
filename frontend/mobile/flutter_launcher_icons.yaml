# Flutter Launcher Icons Configuration
# Run: flutter pub run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

  # Android configuration
  android_min_sdk_android: 21
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

  # iOS configuration
  ios_background_color: "#2196F3"

  # Generate multiple sizes
  android_generate_all_sizes: true
  ios_generate_all_sizes: true

  # Remove old launcher icons
  remove_alpha_ios: true

  # Platform specific icons
  android_icons:
    - size: 36
      density: ldpi
    - size: 48
      density: mdpi
    - size: 72
      density: hdpi
    - size: 96
      density: xhdpi
    - size: 144
      density: xxhdpi
    - size: 192
      density: xxxhdpi

  ios_icons:
    - size: 20
      scale: 1
    - size: 20
      scale: 2
    - size: 20
      scale: 3
    - size: 29
      scale: 1
    - size: 29
      scale: 2
    - size: 29
      scale: 3
    - size: 40
      scale: 1
    - size: 40
      scale: 2
    - size: 40
      scale: 3
    - size: 60
      scale: 2
    - size: 60
      scale: 3
    - size: 76
      scale: 1
    - size: 76
      scale: 2
    - size: 83.5
      scale: 2
    - size: 1024
      scale: 1
